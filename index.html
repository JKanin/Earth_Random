<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Earth</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div id="tools">
  <button id="toggleUi" class="tool" title="Скрыть/показать интерфейс">UI</button>
  <button id="fs" class="tool" title="Во весь экран" aria-label="Во весь экран">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>

<div id="ui">
  <div id="panel">
    <button id="dice" aria-label="Случайное место">
      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4"/>
        <circle cx="8.2" cy="8.2" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.8" cy="8.2" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="8.2" cy="15.8" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.8" cy="15.8" r="1.3" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <div id="text"><div id="name">ЗЕМЛЯ</div><div id="sub">Нажмите на кубик</div></div>
    <div id="actions">
    <button id="back" aria-label="Назад, на уровень выше" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      Назад
    </button>
    <button id="skip" aria-label="Пропустить анимацию" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></svg>
      Пропустить
    </button>
    </div>
  </div>
  <div id="filters">
    <select id="fUn" aria-label="Фильтр стран">
      <option value="un">🇺🇳 Страны ООН</option>
    </select>
    <select id="fSubject" hidden aria-label="Регион России">
      <option value="">Случайный регион</option>
    </select>
    <select id="fRegion" aria-label="Фильтр по части света">
      <option value="">Весь мир</option>
      <option>Europe</option><option>Asia</option><option>Africa</option>
      <option>Americas</option><option>Oceania</option>
    </select>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="api.js"></script>
<script src="modes/russia.js"></script>
<script src="modes/belarus.js"></script>
<script src="modes/kazakhstan.js"></script>
<script src="app.js"></script>
</body>
</html>
